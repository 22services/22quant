# q22 — the frozen NQ/ES portfolio (research/PREREGISTRATION.md D-5) on a Lucid LucidFlex 50K,
# through Rithmic R|Protocol.
#
#   Bots: MNQ intraday momentum (resting trail)   — only when MES confirms the breakout
#         MES intraday momentum (30-min exits)     — only when MNQ confirms the breakout
#   OOS 2019-26 (real micro costs): +$11.0k, Sharpe 0.51, max DD −$2.4k, worst day −$461.
#   Label: PLAUSIBLE, not validated — start in "signals", then "assist", then "auto".
#
# Before running (one-time):
#   1. Rithmic conformance: email Rithmic for the R|Protocol dev kit, pass their conformance test,
#      receive the app-name prefix and the WebSocket URL(s).
#   2. export Q22_RITHMIC_URL=wss://…  Q22_RITHMIC_SYSTEM="<system name in R|Trader Pro, e.g. Lucid's>"
#      export Q22_RITHMIC_USER=…  Q22_RITHMIC_PASSWORD=…  Q22_RITHMIC_APP_NAME=<prefix>:q22
#   3. q22 broker-check -c config/nq_es_lucidflex_50k.toml   (read-only)
#   4. q22 run -c config/nq_es_lucidflex_50k.toml

mode = "signals"                 # signals → assist → auto (after a week of sane signals)

[account]
rules = "lucidflex_50k"          # or "lucidpro_50k" ($1,200 soft daily loss limit, no consistency)

[guard]
risk_per_trade_usd = 250.0
risk_per_trade_frac = 0.0
max_trades_per_day = 6
max_consecutive_losses = 3
min_seconds_between_entries = 120
max_orders_per_minute = 20
min_hold_seconds = 30
min_buffer_frac = 0.25
consistency_lock_frac = 0.8
max_buffer_risk_frac = 0.15
operator_heartbeat_s = 180
news_events = []                 # add tier-1 releases (UTC)

[allocator]
regime_gating = false            # 16-year ablation: daily regime gating lowered Sharpe
adaptive_health = false

[[instrument]]
symbol = "MNQ"
timeframe_min = 5
slippage_ticks = 1.0

[[instrument]]
symbol = "MES"
timeframe_min = 5
slippage_ticks = 1.0

[[strategy]]
id = "nb_mnq"
kind = "noise_breakout"
instruments = ["MNQ"]
[strategy.params]
exit_mode = "resting"
peer_filter = "confirm"          # NQ/ES divergence = skip: unconfirmed breakouts lost IS & OOS

[[strategy]]
id = "nb_mes"
kind = "noise_breakout"
instruments = ["MES"]
[strategy.params]
exit_mode = "checks"
peer_filter = "confirm"
protect_atr = 0.5

[runtime]
broker = "rithmic"
feed = "broker"
poll_secs = 10
warmup_days = 60
flatten_on_exit = true
on_unmanaged_position = "alert"
state_dir = "../state/lucid"

[dashboard]
bind = "127.0.0.1:8722"
reports_dir = "../reports"
