# q22 — replay the frozen NQ/ES portfolio on your 16-year Databento data (no account needed).
#   q22 databento --input "../NQ DATA/glbx-mdp3-20100606-20260709.ohlcv-1m.csv" --root NQ --out data/databento/NQ_c1_1m.csv
#   q22 databento --input "../ES DATA/glbx-mdp3-20100606-20260709.ohlcv-1m.csv" --root ES --out data/databento/ES_c1_1m.csv
#   q22 run -c config/nq_es_replay.toml      → dashboard: both markets, confirm/diverge reasons in the log
mode = "auto"

[account]
rules = "lucidflex_50k"
[guard]
risk_per_trade_usd = 250.0
risk_per_trade_frac = 0.0
max_trades_per_day = 6
max_consecutive_losses = 3
min_seconds_between_entries = 120
max_orders_per_minute = 20
min_hold_seconds = 30
min_buffer_frac = 0.25
consistency_lock_frac = 0.8
max_buffer_risk_frac = 0.15
operator_heartbeat_s = 0
news_events = []                 # add tier-1 releases (UTC)

[allocator]
regime_gating = false            # 16-year ablation: daily regime gating lowered Sharpe
adaptive_health = false

[[instrument]]
symbol = "MNQ"
timeframe_min = 5
slippage_ticks = 1.0

[[instrument]]
symbol = "MES"
timeframe_min = 5
slippage_ticks = 1.0

[[strategy]]
id = "nb_mnq"
kind = "noise_breakout"
instruments = ["MNQ"]
[strategy.params]
exit_mode = "resting"
peer_filter = "confirm"          # NQ/ES divergence = skip: unconfirmed breakouts lost IS & OOS

[[strategy]]
id = "nb_mes"
kind = "noise_breakout"
instruments = ["MES"]
[strategy.params]
exit_mode = "checks"
peer_filter = "confirm"
protect_atr = 0.5

[runtime]
broker = "paper"
feed = "replay"
replay_speed = 50
replay_from = "2026-03-02"
state_dir = "../state/replay_nq_es"

[runtime.replay_files]
MNQ = "../data/databento/NQ_c1_1m.csv"
MES = "../data/databento/ES_c1_1m.csv"

[dashboard]
bind = "127.0.0.1:8722"
reports_dir = "../reports"
