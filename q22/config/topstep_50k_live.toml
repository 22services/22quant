# q22 — Topstep 50K via the official TopstepX (ProjectX Gateway) API.
#
# Before running:
#   1. Subscribe to the TopstepX API in your Topstep dashboard ($14.50–29/month) and create an API key.
#   2. export Q22_PROJECTX_USER="your-topstepx-username"
#      export Q22_PROJECTX_KEY="your-api-key"
#   3. Run on YOUR OWN computer — Topstep prohibits VPS, VPN and remote servers for order routing.
#   4. Keep the dashboard open: automation must be actively monitored (operator heartbeat).
#   5. If you restart mid-evaluation, set resume_balance / resume_threshold from the platform.
#
#   cargo run --release -p q22-app -- check -c config/topstep_50k_live.toml
#   cargo run --release -p q22-app -- run   -c config/topstep_50k_live.toml

mode = "auto"

[account]
rules = "topstep_50k"
# resume_balance = 50750.0       # current balance shown by Topstep
# resume_threshold = 48750.0     # current Maximum Loss Limit level shown by Topstep
# [account.overrides]
# daily_loss_limit = 1000.0      # only if you bought the DLL add-on

[guard]
risk_per_trade_usd = 250.0       # rolling pass-rate sweep 2020-23: $250–300 ≈ same pass rate as $200, ~30 fewer sessions
risk_per_trade_frac = 0.0
max_trades_per_day = 5
max_consecutive_losses = 3
operator_heartbeat_s = 180       # no new entries if the dashboard has not been visible for 3 minutes
news_events = []                 # add tier-1 releases (UTC) — never hold max size into them

[allocator]
regime_gating = false            # ablation 2020-23 (NDX & SPX): gating by daily regime LOWERED Sharpe in every variant
adaptive_health = false

[[instrument]]
symbol = "MNQ"
timeframe_min = 5
broker_symbol = "MNQ"            # contract search text; the active month is picked automatically
slippage_ticks = 1.0

[[strategy]]
id = "noise_breakout"             # Zarattini-Aziz-Barbon intraday momentum: NDX 2020-23 Sharpe 1.26, SPX 1.02 (net, deflated for 11 trials: DSR 0.75 / 0.57)
kind = "noise_breakout"

[[strategy]]
id = "orb"
kind = "orb"
enabled = false                  # NDX 2020-23 Sharpe 0.65, SPX 0.14, NQ 2026 ~0 — weak; crowds out noise_breakout

[[strategy]]
id = "last_half_hour"
kind = "last_half_hour"
enabled = false                  # NDX −1.50, SPX −2.22 Sharpe 2020-23: the published effect does not survive here

[[strategy]]
id = "vwap_reversion"
kind = "vwap_reversion"
enabled = false                  # NDX 0.10, SPX −1.13 Sharpe: no edge after costs

[runtime]
broker = "projectx"
feed = "broker"
poll_secs = 5
warmup_days = 60
projectx_api = "https://api.topstepx.com"
# projectx_account = "50KTC-V2-123456-78901234"   # exact account name; default = first tradable account
flatten_on_exit = true
on_unmanaged_position = "alert"
state_dir = "../state/topstep"

[dashboard]
bind = "127.0.0.1:8722"
reports_dir = "../reports"
