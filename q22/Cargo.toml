[workspace]
resolver = "2"
members = ["crates/q22-core", "crates/q22-engine", "crates/q22-broker", "crates/q22-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"
authors = ["22services"]

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10"
toml = "0.8"
rand = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "fs"] }
axum = { version = "0.8", features = ["json", "query"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "rustls-tls-native-roots"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
futures = "0.3"
async-trait = "0.1"

q22-core = { path = "crates/q22-core" }
q22-engine = { path = "crates/q22-engine" }
q22-broker = { path = "crates/q22-broker" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false

[profile.dev.package."*"]
opt-level = 2
